<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>CZI Volume Studio</title>
  <!-- A z-stack of three slices with a traced filament (accent #5ec8a8) rising through it.
       Small renderings (tab, title bar, taskbar) switch to simplified drawings via the media queries. -->
  <style>
    .s16, .s32 { display: none; }
    @media (max-width: 40px) { .big { display: none; } .s32 { display: inline; } }
    @media (max-width: 20px) { .s32 { display: none; } .s16 { display: inline; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#252b35"/>
      <stop offset="1" stop-color="#101216"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9bccf" stop-opacity=".30"/>
      <stop offset="1" stop-color="#a9bccf" stop-opacity=".12"/>
    </linearGradient>
  </defs>

  <g class="big">
    <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bg)"/>
    <rect x="9" y="9" width="238" height="238" rx="53" fill="none" stroke="#fff" stroke-opacity=".09" stroke-width="2"/>
    <path d="M44 164 L128 206 L212 164 L128 122 Z" fill="url(#plate)" stroke="#b9c7d6" stroke-opacity=".4" stroke-width="5" stroke-linejoin="round"/>
    <g fill="none" stroke-linecap="round">
      <path d="M62 190 C 80 168, 104 172, 116 152 C 128 132, 150 136, 156 110 C 162 86, 176 72, 194 66" stroke="#5ec8a8" stroke-opacity=".25" stroke-width="24"/>
      <path d="M62 190 C 80 168, 104 172, 116 152 C 128 132, 150 136, 156 110 C 162 86, 176 72, 194 66" stroke="#5ec8a8" stroke-width="12"/>
    </g>
    <path d="M44 128 L128 170 L212 128 L128 86 Z" fill="#1a2028" fill-opacity=".45" stroke="#c3d0dd" stroke-opacity=".6" stroke-width="5" stroke-linejoin="round"/>
    <path d="M116 152 C 128 132, 150 136, 156 110 C 162 86, 176 72, 194 66" fill="none" stroke="#6fd6b6" stroke-width="12" stroke-linecap="round"/>
    <path d="M44 92 L128 134 L212 92 L128 50 Z" fill="#1d242d" fill-opacity=".45" stroke="#dbe5ee" stroke-opacity=".9" stroke-width="5" stroke-linejoin="round"/>
    <path d="M156 110 C 162 86, 176 72, 194 66" fill="none" stroke="#8ee6c9" stroke-width="12" stroke-linecap="round"/>
    <circle cx="62" cy="190" r="10" fill="#5ec8a8"/>
    <circle cx="194" cy="66" r="12" fill="#eafff8"/>
  </g>

  <!-- 32 px drawing (32-unit grid) -->
  <g class="s32" transform="scale(8)">
    <rect x="0.5" y="0.5" width="31" height="31" rx="7" fill="url(#bg)"/>
    <path d="M5 20.5 L16 26 L27 20.5 L16 15 Z" fill="#a9bccf" fill-opacity=".16" stroke="#7f8ea0" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M7.5 25 C 10.5 21, 13.5 21.5, 15 18.5 C 16.5 15.5, 18.5 15.5, 19.4 13" fill="none" stroke="#5ec8a8" stroke-width="3" stroke-linecap="round"/>
    <path d="M5 12 L16 17.5 L27 12 L16 6.5 Z" fill="#1d242d" fill-opacity=".5" stroke="#dbe5ee" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M19.4 13 C 20.3 10.5, 21.8 8.8, 24 8" fill="none" stroke="#8ee6c9" stroke-width="3" stroke-linecap="round"/>
    <circle cx="24" cy="8" r="2.1" fill="#eafff8"/>
    <circle cx="7.5" cy="25" r="1.7" fill="#5ec8a8"/>
  </g>

  <!-- 16 px drawing (16-unit grid) -->
  <g class="s16" transform="scale(16)">
    <rect x="0" y="0" width="16" height="16" rx="3.5" fill="url(#bg)"/>
    <path d="M2.5 10.5 L8 13.25 L13.5 10.5 L8 7.75 Z" fill="#a9bccf" fill-opacity=".18" stroke="#8796a8" stroke-width="1" stroke-linejoin="round"/>
    <path d="M2.5 6.5 L8 9.25 L13.5 6.5 L8 3.75 Z" fill="#a9bccf" fill-opacity=".14" stroke="#d6e0ea" stroke-width="1" stroke-linejoin="round"/>
    <path d="M3.6 12.6 C 6 10.6, 7.6 11, 8.6 8.6 S 10.6 4.6, 12.4 3.6" fill="none" stroke="#5ec8a8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="12.4" cy="3.6" r="1.4" fill="#eafff8"/>
  </g>
</svg>
